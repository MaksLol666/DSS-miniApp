name: Validate DSS Mini App

on:
  push:
    branches: [main, rewrite-v2, fix/club-dcp-fixed-discounts, fix/miniapp-infinite-loading, fix/telegram-sdk-blocking, feature/dss-club-ranks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q api.py bot.py main.py config.py database
      - run: node --check static/app.js
      - run: python -c "import api; assert any(getattr(r, 'path', None) == '/api/health' for r in api.app.routes); assert any(getattr(r, 'path', None) == '/' for r in api.app.routes); print('API import and route checks passed')"
      - name: Test DSS promo and club discount calculations
        run: |
          python - <<'PY'
          import api

          items = [{"product_id": 1, "category_id": 1, "category_name": "Жижа", "price": 1000, "quantity": 1}]
          promo = api.Promocode(
              code="TEST100", owner_id=0, kind="fixed", amount=100, used=False,
              created_by="admin", max_uses=1, used_count=0, target_type="all", min_order=0
          )
          assert api._totals(items, [promo])["total"] == 900
          promo.used_count = 1
          assert api._totals(items, [promo])["total"] == 1000

          club_config = {"economy": {
              "min_order": 500, "min_product_price": 500, "dcp_per_ruble": 100,
              "redemption_tiers": [[100, 50]]
          }}
          below_minimum = api._club_discount_for_cart(
              [{"price": 400, "cost_price": 200, "quantity": 1}], 400, club_config
          )
          assert below_minimum["available"] is False
          valid = api._club_discount_for_cart(
              [{"price": 500, "cost_price": 200, "quantity": 1}], 500, club_config
          )
          assert valid["available"] is True and valid["required_points"] == 5000

          club_promo = api.Promocode(
              code="CLUB50", owner_id=1, kind="fixed", amount=50, used=False,
              created_by="club", max_uses=1, used_count=0, target_type="all", min_order=0
          )
          bundle = {**items[0], "category_name": "Наборы"}
          assert api._promo_matches_item(club_promo, bundle) is False
          print("Promo limits, DCP minimum and club bundle rules passed.")
          PY
      - name: Test legacy SQLite cart migration
        run: |
          python - <<'PY'
          import asyncio
          import tempfile
          from pathlib import Path
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          import database.db as db

          async def main():
              with tempfile.TemporaryDirectory() as directory:
                  url = f"sqlite+aiosqlite:///{Path(directory) / 'legacy.db'}"
                  db.DB_URL = url
                  db.engine = create_async_engine(url, connect_args={"timeout": 30})
                  async with db.engine.begin() as connection:
                      await connection.exec_driver_sql("""
                          CREATE TABLE cart_items (
                              id INTEGER PRIMARY KEY,
                              user_id BIGINT NOT NULL,
                              product_id INTEGER NOT NULL,
                              reserved BOOLEAN NOT NULL DEFAULT 0,
                              quantity INTEGER NOT NULL DEFAULT 1
                          )
                      """)
                      await connection.exec_driver_sql(
                          "INSERT INTO cart_items (id, user_id, product_id, quantity) VALUES (1, 123, 7, 2), (2, 123, 7, 3)"
                      )
                  await db.init_db()
                  async with db.engine.connect() as connection:
                      rows = (await connection.execute(text(
                          "SELECT user_id, product_id, quantity FROM cart_items"
                      ))).all()
                      assert rows == [(123, 7, 5)], rows
                      indexes = (await connection.exec_driver_sql("PRAGMA index_list(cart_items)")).fetchall()
                      assert any(row[1] == "uq_cart_items_user_product" for row in indexes), indexes
                  await db.engine.dispose()

          asyncio.run(main())
          print("Legacy duplicate cart rows merge and unique index migration passed.")
          PY
      - name: Smoke test HTTP routes
        shell: bash
        run: |
          set -e
          python main.py > /tmp/dss-api.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/dss-health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"ok":true' /tmp/dss-health.json
          curl -fsS http://127.0.0.1:3000/ | grep -q 'Dead Smoke Store'
          curl -fsS 'http://127.0.0.1:3000/app.js?v=2' | grep -q 'function init'
          curl -fsS 'http://127.0.0.1:3000/styles.css?v=2' | grep -q ':root'
          echo "Health endpoint, HTML, JavaScript and CSS all respond correctly."
          cat /tmp/dss-api.log
