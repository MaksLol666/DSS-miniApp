<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>Dead Smoke Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--panel:#151515;--line:#292929;--text:#f5f5f5;--muted:#a3a3a3;--accent:#9b70ff;--danger:#f87171}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#100b19;font-weight:700}button:disabled{opacity:.45;cursor:default}.app{max-width:720px;margin:auto;padding:16px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:21px;font-weight:850;letter-spacing:-.5px}.muted{color:var(--muted)}.small{font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:9px 8px calc(9px + env(safe-area-inset-bottom));background:#111e;border-top:1px solid var(--line);backdrop-filter:blur(14px);z-index:5}.nav button{flex:1;max-width:170px;background:transparent;color:var(--muted);padding:10px 4px;font-size:12px}.nav button.active{background:#2b2140;color:#d9c7ff}.section-title{font-size:23px;font-weight:800;margin:10px 0 4px}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 16px}.chip{white-space:nowrap;background:#1b1b1b;color:#ddd;border:1px solid var(--line);padding:9px 12px;border-radius:999px;font-size:13px}.chip.active{background:#2d2147;border-color:#8b5cf6;color:#e5d8ff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product,.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px;min-width:0}.product .emoji{font-size:30px;margin-bottom:8px}.product h3{font-size:15px;margin:0 0 5px;overflow-wrap:anywhere}.product .flavor{font-size:13px;color:var(--muted);min-height:34px}.product-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}.price{font-weight:800}.add{padding:9px 12px;border-radius:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.empty{padding:36px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed #343434;border-radius:16px}.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.primary{width:100%;margin-top:12px}.field{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#101010;color:var(--text);margin-top:6px}.field-label{display:block;color:var(--muted);font-size:13px;margin-top:12px}.error{background:#321818;border:1px solid #6c2929;color:#fecaca;padding:12px;border-radius:12px;margin-bottom:12px}.success{background:#152b1c;border:1px solid #28583a;color:#bbf7d0;padding:12px;border-radius:12px;margin-bottom:12px}.spinner{padding:50px 0;text-align:center;color:var(--accent)}.badge{font-size:11px;padding:5px 8px;background:#28213b;color:#d8c5ff;border-radius:999px}.actions{display:flex;gap:8px}.actions button{flex:1}.secondary{background:#252525;color:var(--text)}@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
<div id="root"><div class="spinner">💨 Загружаем магазин…</div></div>
<script src="/app.js" defer></script>
</body>
</html>
