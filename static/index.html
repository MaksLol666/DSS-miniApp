<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dead Smoke Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }
  </style>
  
  <style>
    #ddg-captcha-gate { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(7, 7, 10, .96); }
    #ddg-captcha-card { width: min(100%, 420px); padding: 24px; border: 1px solid #34233f; border-radius: 20px; background: #141117; box-shadow: 0 20px 70px rgba(0,0,0,.45); text-align: center; }
    #ddg-captcha-card h2 { margin: 0 0 10px; font-size: 22px; }
    #ddg-captcha-card p { color: #b9b2bf; line-height: 1.45; font-size: 14px; }
    #ddg-captcha-slot { display: flex; justify-content: center; min-height: 70px; margin: 18px 0; }
    #ddg-captcha-error { color: #ff7777; font-size: 13px; min-height: 18px; }
    #ddg-captcha-retry { display: none; width: 100%; border: 0; border-radius: 12px; padding: 13px; background: #8b3dca; color: white; font-weight: 700; }
  </style>
  <script>
    // Keep the app hidden until the backend confirms a valid CAPTCHA session.
    document.documentElement.style.visibility = 'hidden';
    (function () {
      var siteKey = '';
      var widgetId = null;
      var apiLoading = false;
      var gate;
      var errorNode;
      var retryButton;

      function initGateMarkup() {
        if (gate) return;
        gate = document.createElement('div');
        gate.id = 'ddg-captcha-gate';
        gate.innerHTML = '<div id="ddg-captcha-card"><h2>Проверка безопасности</h2><p>Подтверди, что ты не робот, чтобы открыть магазин.</p><div id="ddg-captcha-slot"></div><div id="ddg-captcha-error"></div><button id="ddg-captcha-retry" type="button">Попробовать ещё раз</button></div>';
        document.body.appendChild(gate);
        errorNode = document.getElementById('ddg-captcha-error');
        retryButton = document.getElementById('ddg-captcha-retry');
        retryButton.addEventListener('click', function () {
          retryButton.style.display = 'none';
          errorNode.textContent = '';
          renderWidget();
        });
      }

      function getInitData() {
        return window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData || '' : '';
      }

      function renderWidget() {
        initGateMarkup();
        document.getElementById('ddg-captcha-slot').innerHTML = '';
        widgetId = null;
        if (!siteKey) {
          errorNode.textContent = 'CAPTCHA не настроена. Сообщи администратору.';
          retryButton.style.display = 'block';
          return;
        }
        if (apiLoading) return;
        if (window.ddgcaptcha && typeof window.ddgcaptcha.render === 'function') {
          window.ddgcaptcha.ready(function () {
            try {
              widgetId = window.ddgcaptcha.render('#ddg-captcha-slot', {
                sitekey: siteKey,
                callback: submitToken
              }, false);
            } catch (e) {
              errorNode.textContent = 'Не удалось загрузить проверку. Попробуй ещё раз.';
              retryButton.style.display = 'block';
            }
          });
          return;
        }
        apiLoading = true;
        window.initCaptcha = function () {
          apiLoading = false;
          if (window.ddgcaptcha && typeof window.ddgcaptcha.ready === 'function') {
            window.ddgcaptcha.ready(function () {
              try {
                widgetId = window.ddgcaptcha.render('#ddg-captcha-slot', {
                  sitekey: siteKey,
                  callback: submitToken
                }, false);
              } catch (e) {
                errorNode.textContent = 'Не удалось загрузить проверку. Попробуй ещё раз.';
                retryButton.style.display = 'block';
              }
            });
          }
        };
        var script = document.createElement('script');
        script.src = 'https://captcha.ddos-guard.net/static/api.js?render=explicit&onload=initCaptcha';
        script.async = true;
        script.onerror = function () {
          apiLoading = false;
          errorNode.textContent = 'Не удалось загрузить CAPTCHA. Проверь интернет и повтори.';
          retryButton.style.display = 'block';
        };
        document.head.appendChild(script);
      }

      async function submitToken(token) {
        errorNode.textContent = '';
        retryButton.style.display = 'none';
        try {
          var response = await fetch('/api/captcha/verify', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'X-Init-Data': getInitData() },
            body: JSON.stringify({ token: token })
          });
          if (!response.ok) {
            var data = await response.json().catch(function () { return {}; });
            throw new Error(data.detail || 'Проверка не пройдена.');
          }
          gate.style.display = 'none';
          document.documentElement.style.visibility = 'visible';
        } catch (e) {
          errorNode.textContent = e.message || 'Не удалось проверить CAPTCHA.';
          retryButton.style.display = 'block';
          if (window.ddgcaptcha && widgetId !== null) {
            try { window.ddgcaptcha.reset(widgetId); } catch (_) {}
          }
        }
      }

      window.__ddgShowCaptcha = function () {
        initGateMarkup();
        gate.style.display = 'flex';
        document.documentElement.style.visibility = 'visible';
        renderWidget();
      };

      // Axios uses XMLHttpRequest in this build. HTTP 428 means a fresh challenge is required.
      var originalSend = XMLHttpRequest.prototype.send;
      XMLHttpRequest.prototype.send = function () {
        this.addEventListener('loadend', function () {
          if (this.status === 428 && window.__ddgShowCaptcha) {
            window.__ddgShowCaptcha();
          }
        });
        return originalSend.apply(this, arguments);
      };

      window.addEventListener('DOMContentLoaded', async function () {
        try {
          var configResponse = await fetch('/api/captcha/config', { cache: 'no-store' });
          var config = await configResponse.json();
          if (!config.enabled) {
            document.documentElement.style.visibility = 'visible';
            return;
          }
          siteKey = config.site_key || '';
          var statusResponse = await fetch('/api/captcha/status', {
            headers: { 'X-Init-Data': getInitData() },
            credentials: 'same-origin',
            cache: 'no-store'
          });
          var status = statusResponse.ok ? await statusResponse.json() : { verified: false };
          if (status.verified) {
            document.documentElement.style.visibility = 'visible';
            return;
          }
          document.documentElement.style.visibility = 'visible';
          initGateMarkup();
          renderWidget();
        } catch (e) {
          document.documentElement.style.visibility = 'visible';
          initGateMarkup();
          errorNode.textContent = 'Не удалось проверить статус безопасности. Обнови страницу.';
          retryButton.style.display = 'block';
        }
      });
    })();
  </script>

  <script type="module" crossorigin src="./assets/index-xYo8N1Zl.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-sZjvNE-E.css">
</head>
<body>
  <div id="root"></div>
</body>
</html>
